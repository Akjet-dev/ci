name: Build image

# Reusable workflow: builds one container image with BuildKit on a GitHub-hosted runner, scans it for
# vulnerabilities, pushes it to GHCR and returns its digest. It never deploys and has no access to any
# cluster.
#
# Images are published only from the branches listed in PUBLISH_BRANCHES below; from any other branch
# the image is built and scanned but not pushed (push: false is forced, no digest is returned).
# Interface and examples: docs/workflows.md

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Deprecated - the image is declared in the values (image.repository of <values-dir>/values.yaml).
          When set: the image name under ghcr.io/<owner>/; it must then agree with the values.
        type: string
        default: ''
      values-dir:
        description: Directory with values.yaml; its image.repository names the image that is built and published
        type: string
        default: 'deploy'
      context:
        description: Build context, relative to the repository root
        type: string
        default: '.'
      dockerfile:
        description: Dockerfile path, relative to the repository root
        type: string
        default: 'Dockerfile'
      target:
        description: Optional build stage
        type: string
        default: ''
      build-args:
        description: Non-secret build arguments, one NAME=value per line (they are stored in the image history)
        type: string
        default: ''
      platform:
        description: Target platform (only linux/amd64 - the architecture of the cluster nodes)
        type: string
        default: 'linux/amd64'
      cache:
        description: Keep a BuildKit layer cache in the registry (<image>:buildcache); used only when the image is pushed
        type: boolean
        default: true
      push:
        description: Publish the image. Ignored (treated as false) outside the publishing branches.
        type: boolean
        default: true
      scan:
        description: Scan the image for vulnerabilities
        type: boolean
        default: true
      scan-fail-on:
        description: Severities that fail the build when a fix exists, e.g. "CRITICAL" or "HIGH,CRITICAL"; empty - report only
        type: string
        default: 'CRITICAL'
    secrets:
      build-secrets:
        description: >-
          Optional BuildKit secrets, one ID=value per line, composed by the caller from its own secrets.
          Mounted only during the build (RUN --mount=type=secret,id=ID); never stored in a layer.
        required: false
    outputs:
      image:
        description: Image repository, e.g. ghcr.io/<owner>/<image>
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Image digest, sha256:<64 hex>; empty when the image was not published
        value: ${{ jobs.build.outputs.digest }}
      published:
        description: '"true" when the image was pushed to the registry'
        value: ${{ jobs.build.outputs.published }}

permissions:
  contents: read

env:
  # Branches that may publish images, space separated. Deliberately not an input.
  PUBLISH_BRANCHES: 'dev-k8s/release stage-k8s/release'
  # Vulnerability gate. 'false' = ADVISORY (temporary, for the Kubernetes migration): vulnerabilities are
  # scanned, reported and counted, but do not stop the build or the publication. 'true' = an image with
  # fixable vulnerabilities of a severity listed in scan-fail-on is not published.
  # Embedded secrets and scanner failures stop the build in both modes.
  TRIVY_BLOCK_ON_CVES: 'false'
  TRIVY_VERSION: '0.76.1'
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # The caller must grant the same permissions to the calling job.
    permissions:
      contents: read
      packages: write

    # A newer commit supersedes a build that is still running.
    concurrency:
      group: build-image-${{ github.repository }}-${{ github.ref }}-${{ inputs.image }}
      cancel-in-progress: true

    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      published: ${{ steps.names.outputs.push }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve names
        id: names
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          VALUES_DIR: ${{ inputs.values-dir }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORM: ${{ inputs.platform }}
          PUSH_INPUT: ${{ inputs.push }}
          SCAN_FAIL_ON: ${{ inputs.scan-fail-on }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          # The image is the one the service deploys: image.repository of its values. Nothing is derived
          # from the repository name. The deprecated input may only confirm it.
          case "${VALUES_DIR}" in /*|*..*) echo "::error::values-dir must be a relative path inside the repository"; exit 1 ;; esac
          declared=""
          if [ -f "${VALUES_DIR}/values.yaml" ]; then
            declared="$(yq '.image.repository // ""' "${VALUES_DIR}/values.yaml")"
          fi
          if [ -n "${IMAGE_INPUT}" ]; then
            if ! printf '%s' "${IMAGE_INPUT}" | grep -Eq '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$'; then
              echo "::error::image name must match ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?\$"; exit 1
            fi
            image="ghcr.io/${owner}/${IMAGE_INPUT}"
            if [ -n "${declared}" ] && [ "${declared}" != "${image}" ]; then
              echo "::error::input image builds ${image}, but ${VALUES_DIR}/values.yaml deploys ${declared}"; exit 1
            fi
          elif [ -n "${declared}" ]; then
            image="${declared}"
          else
            echo "::error::no image: set image.repository in ${VALUES_DIR}/values.yaml"; exit 1
          fi
          if ! printf '%s' "${image}" | grep -Eq "^ghcr\.io/${owner}/[a-z0-9]([a-z0-9._/-]*[a-z0-9])?\$"; then
            echo "::error::image ${image} must be a repository under ghcr.io/${owner}/ (lower case, no tag or digest)"; exit 1
          fi
          for path in "${CONTEXT}" "${DOCKERFILE}"; do
            case "${path}" in
              /*|*..*) echo "::error::context and dockerfile must be relative paths inside the repository"; exit 1 ;;
            esac
          done
          test -f "${DOCKERFILE}" || { echo "::error::Dockerfile not found: ${DOCKERFILE}"; exit 1; }
          if [ "${PLATFORM}" != "linux/amd64" ]; then
            echo "::error::only linux/amd64 is supported"; exit 1
          fi
          if ! printf '%s' "${SCAN_FAIL_ON}" | grep -Eq '^((UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL)(,(UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL))*)?$'; then
            echo "::error::scan-fail-on must be a comma separated list of severities"; exit 1
          fi
          push=false
          if [ "${PUSH_INPUT}" = "true" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            for branch in ${PUBLISH_BRANCHES}; do
              if [ "${GITHUB_REF_NAME}" = "${branch}" ]; then push=true; fi
            done
          fi
          if [ "${PUSH_INPUT}" = "true" ] && [ "${push}" != "true" ]; then
            echo "::notice::${GITHUB_REF_NAME} is not a publishing branch (${PUBLISH_BRANCHES}): the image is built and scanned, not pushed"
          fi
          {
            echo "image=${image}"
            echo "push=${push}"
          } >> "${GITHUB_OUTPUT}"
          echo "Image: ${image} (push: ${push})"

      - name: Log in to GHCR
        if: steps.names.outputs.push == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Create BuildKit builder
        run: |
          set -euo pipefail
          docker buildx create --name ci --driver docker-container --use
          docker buildx inspect --bootstrap

      # The image is built into the local Docker engine first, scanned there, and pushed only afterwards:
      # an image stopped by the scan step never reaches the registry.
      - name: Build
        id: build
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          PUSH: ${{ steps.names.outputs.push }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET: ${{ inputs.target }}
          PLATFORM: ${{ inputs.platform }}
          BUILD_ARGS: ${{ inputs.build-args }}
          USE_CACHE: ${{ inputs.cache }}
          BUILD_SECRETS: ${{ secrets.build-secrets }}
        run: |
          set -euo pipefail
          umask 077
          secret_dir="${RUNNER_TEMP}/build-secrets"
          mkdir -p "${secret_dir}"

          args=(
            --file "${DOCKERFILE}"
            --platform "${PLATFORM}"
            --tag "${IMAGE}:sha-${GITHUB_SHA}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --provenance=false
            --sbom=false
            --load
          )
          if [ -n "${TARGET}" ]; then args+=(--target "${TARGET}"); fi
          if [ "${USE_CACHE}" = "true" ] && [ "${PUSH}" = "true" ]; then
            args+=(--cache-from "type=registry,ref=${IMAGE}:buildcache")
            args+=(--cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max")
          fi

          # Non-secret build arguments: NAME=value per line.
          while IFS= read -r line; do
            [ -n "${line}" ] || continue
            if ! printf '%s' "${line}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*='; then
              echo "::error::build-args: every line must be NAME=value"; exit 1
            fi
            args+=(--build-arg "${line}")
          done <<< "${BUILD_ARGS}"

          # Secrets: ID=value per line -> one file per secret -> BuildKit secret mount. Values are never
          # passed on a command line and never printed.
          count=0
          while IFS= read -r line; do
            [ -n "${line}" ] || continue
            id="${line%%=*}"
            if [ "${id}" = "${line}" ] || ! printf '%s' "${id}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
              echo "::error::build-secrets: every line must be ID=value (the offending line is not shown)"; exit 1
            fi
            printf '%s' "${line#*=}" > "${secret_dir}/${id}"
            args+=(--secret "id=${id},src=${secret_dir}/${id}")
            count=$((count + 1))
          done <<< "${BUILD_SECRETS:-}"
          echo "Build secrets mounted: ${count}"

          docker buildx build "${args[@]}" "${CONTEXT}"

      - name: Install Trivy
        if: inputs.scan
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"; mkdir -p "${bin}"; cd "${RUNNER_TEMP}"
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C "${bin}" trivy
          echo "${bin}" >> "${GITHUB_PATH}"

      # Three different outcomes, never mixed up:
      #   the scanner could not run or produced no usable report  -> error, in every mode
      #   secrets embedded in the image (severity in scan-fail-on) -> error, in every mode
      #   vulnerabilities                                          -> reported; they stop the build only
      #                                                               when TRIVY_BLOCK_ON_CVES is 'true'
      - name: Scan for vulnerabilities
        id: scan
        if: inputs.scan
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SCAN_FAIL_ON: ${{ inputs.scan-fail-on }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:sha-${GITHUB_SHA}"
          report="${RUNNER_TEMP}/trivy-report.json"
          common=(image --image-src docker --scanners "vuln,secret" --no-progress --severity "HIGH,CRITICAL" --exit-code 0)

          # 1. Human-readable report in the job log: every HIGH and CRITICAL finding, fixable or not.
          trivy "${common[@]}" "${ref}" \
            || { echo "::error::Trivy failed to scan the image (scanner error, not a finding)"; exit 1; }
          # 2. The same scan as JSON: counted below and kept as an artifact.
          trivy "${common[@]}" --quiet --format json --output "${report}" "${ref}" \
            || { echo "::error::Trivy failed to write the scan report (scanner error, not a finding)"; exit 1; }
          jq -e '.SchemaVersion != null' "${report}" >/dev/null \
            || { echo "::error::the Trivy report is missing or not valid (scanner error, not a finding)"; exit 1; }

          gate="$(printf '%s' "${SCAN_FAIL_ON}" | jq -Rc 'split(",") | map(select(length > 0))')"
          count() { jq --argjson gate "${gate}" "$1" "${report}"; }
          high="$(count '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length')"
          critical="$(count '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length')"
          fixable="$(count '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length')"
          # shellcheck disable=SC2016  # $s and $gate are jq variables
          gated="$(count '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "") | select(.Severity as $s | $gate | index($s))] | length')"
          secrets="$(count '[.Results[]?.Secrets[]?] | length')"
          # shellcheck disable=SC2016
          gated_secrets="$(count '[.Results[]?.Secrets[]? | select(.Severity as $s | $gate | index($s))] | length')"

          {
            echo "### Vulnerability scan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| CRITICAL vulnerabilities | ${critical} |"
            echo "| HIGH vulnerabilities | ${high} |"
            echo "| of them with a fix available | ${fixable} |"
            echo "| Embedded secrets | ${secrets} |"
            echo "| Gate severities (scan-fail-on) | \`${SCAN_FAIL_ON:-none}\` |"
            echo "| Vulnerabilities block publication | \`${TRIVY_BLOCK_ON_CVES}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "critical=${critical}"
            echo "high=${high}"
            echo "secrets=${secrets}"
          } >> "${GITHUB_OUTPUT}"
          echo "Trivy: CRITICAL=${critical} HIGH=${high} fixable=${fixable} secrets=${secrets}"

          if [ "${gated_secrets}" -gt 0 ]; then
            echo "::error::the image contains ${gated_secrets} embedded secret(s) of severity ${SCAN_FAIL_ON}; it is not published"
            exit 1
          fi
          if [ "${gated}" -gt 0 ]; then
            if [ "${TRIVY_BLOCK_ON_CVES}" = "true" ]; then
              echo "::error::the image has ${gated} fixable vulnerabilities of severity ${SCAN_FAIL_ON}; it is not published"
              exit 1
            fi
            echo "::warning::ADVISORY MODE: ${gated} fixable vulnerabilities of severity ${SCAN_FAIL_ON} (CRITICAL=${critical}, HIGH=${high} in total) do not block this build (TRIVY_BLOCK_ON_CVES=${TRIVY_BLOCK_ON_CVES})"
          fi

      - name: Keep the scan report
        if: always() && inputs.scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Push
        id: publish
        if: steps.names.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${ref}"
          # The registry digest of exactly what was scanned and pushed.
          digest="$(docker image inspect "${ref}" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | sed -n "s|^${IMAGE}@||p" | head -1)"
          if ! printf '%s' "${digest}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "::error::could not read the digest of the pushed image"; exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Summary
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          PUSH: ${{ steps.names.outputs.push }}
        run: |
          {
            if [ "${PUSH}" = "true" ]; then
              echo "### Image published"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Image | \`${IMAGE}\` |"
              echo "| Digest | \`${DIGEST}\` |"
              echo "| Branch | \`${GITHUB_REF_NAME}\` |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo
              echo "Deploy with the digest above; tags are not accepted by the deploy workflow."
            else
              echo "### Image built and scanned, not published"
              echo
              echo "Branch \`${GITHUB_REF_NAME}\` is not a publishing branch."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/build-secrets"
          docker logout ghcr.io || true
