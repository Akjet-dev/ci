name: Chart CI

# Offline tests of charts/akjet-app and of the reusable workflows (tests/run.sh): helm lint, rendering of
# every fixture, kubeconform, security checks, negative schema tests, actionlint.
# Publishing happens only for a tag chart-akjet-app-<version> that matches Chart.yaml.

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/**'
    tags:
      - 'chart-akjet-app-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  HELM_VERSION: '4.3.1'
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  KUBECONFORM_VERSION: '0.8.0'
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"; mkdir -p "${bin}"; cd "${RUNNER_TEMP}"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && mv linux-amd64/helm "${bin}/helm"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform && mv kubeconform "${bin}/kubeconform"
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint && mv actionlint "${bin}/actionlint"
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Run the test suite
        run: tests/run.sh

  publish:
    name: Publish chart
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'chart-akjet-app-')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Helm
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"; mkdir -p "${bin}"; cd "${RUNNER_TEMP}"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && mv linux-amd64/helm "${bin}/helm"
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#chart-akjet-app-}"
          chart_version="$(sed -n 's/^version: *//p' charts/akjet-app/Chart.yaml)"
          if [ "${version}" != "${chart_version}" ]; then
            echo "::error::tag version ${version} does not match Chart.yaml version ${chart_version}"; exit 1
          fi
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm package charts/akjet-app --destination "${RUNNER_TEMP}/dist"
          printf '%s' "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "${RUNNER_TEMP}/dist/akjet-app-${version}.tgz" "oci://ghcr.io/${owner}/charts"
          helm registry logout ghcr.io
          echo "### Published \`oci://ghcr.io/${owner}/charts/akjet-app\` ${version}" >> "${GITHUB_STEP_SUMMARY}"
