name: Deploy to Kubernetes

# Reusable workflow: validates the rendered manifests on a GitHub-hosted runner, then runs
# `helm upgrade --install` from a self-hosted runner INSIDE the target cluster.
#
#   namespace = <environment>-<repository name>   computed here, never an input. Repositories that the platform
#               places together share <environment>-<group>; the groups are fixed in this file (step
#               "Resolve and check the target") and mirror k8s-infra namespaces/*.yaml
#   runner    = akjet-ds-apps                     fixed in this file (env RUNNER_LABEL), never an input
#
# What may be deployed from where is fixed in this file (step "Resolve and check the target"):
#   dev    validation from any branch; deployment only from the branch dev-k8s/release, and only while
#          the repository variable K8S_DEV_DEPLOY_ENABLED is "true"
#   stage  validation only (validate-only: true); this workflow never deploys it
#
# The workflow receives no kubeconfig: the in-cluster runner uses its own ServiceAccount
# (arc-runners/app-deployer). It accepts two optional secrets, never both in one run:
#   env-bundle   ONE JSON object with the configuration of ONE environment, keys <ENV>_<NAME>. What a key
#                means is decided by the values files of the service, not by the caller: a NAME declared in
#                requiredSecrets becomes a key of that Kubernetes Secret; a NAME listed in
#                <values-dir>/overrides.yaml overrides config.<NAME>; anything else is refused.
#   app-secrets  explicit lines <secret>.<KEY>=<value> for callers with a handful of values.
# Secret values are written with server-side apply, never printed and never stored in a ConfigMap, a Helm
# release, an output, an artifact or a summary.
# akjet-ds-apps is ONE runner scale set shared by all application
# repositories; on GitHub Free it sits in the organization Default runner group, so GitHub does not
# restrict which repository reaches it. The enforced boundary is the cluster RBAC: the ServiceAccount
# has only a namespaced Role in the application namespaces whose workloads are enabled.
# Interface, runner contract and limitations: docs/workflows.md

on:
  workflow_call:
    inputs:
      environment:
        description: '"dev", or "stage" together with validate-only'
        type: string
        required: true
      validate-only:
        description: Render and validate the manifests, do not deploy
        type: boolean
        default: false
      image-digest:
        description: Image digest to deploy, sha256:<64 hex> (output of build-image.yml); optional with validate-only
        type: string
        default: ''
      chart-version:
        description: Exact version of the shared chart
        type: string
        required: true
      release:
        description: Helm release name (default - the repository name)
        type: string
        default: ''
      values-dir:
        description: Directory with values.yaml and values-<environment>.yaml
        type: string
        default: 'deploy'
      chart:
        description: >-
          Chart reference (default - oci://ghcr.io/<owner>/charts/akjet-app). A path starting with ./
          selects a chart inside the calling repository.
        type: string
        default: ''
      run-migrations:
        description: Run the migration Job (values key "migration") before the upgrade
        type: boolean
        default: false
      restart:
        description: Restart all pods even if nothing else changed (after a Secret was updated)
        type: boolean
        default: false
      timeout:
        description: Timeout of the Helm upgrade and of the migration Job, e.g. 10m
        type: string
        default: '10m'
      pod-logs-on-failure:
        description: Print the last log lines of the release pods when the deployment fails
        type: boolean
        default: false
      env-bundle-secret:
        description: >-
          Pass-through mode of env-bundle: the name of ONE Secret declared in requiredSecrets (for example
          "app"). Every <ENV>_<NAME> entry of the bundle then becomes the key NAME of that Kubernetes Secret,
          with its value unchanged - no declaration per variable, no allow-list, no type check. Only entries
          renamed by secrets.aliases of <values-dir>/overrides.yaml go elsewhere (the migration password).
          A NAME that the values files also set under config is removed from the rendered configuration, so
          the Secret is its only source. Empty (default): the declared mode described at the secret.
        type: string
        default: ''
    secrets:
      app-secrets:
        description: >-
          Optional values for Kubernetes Secrets of the release, one per line, composed by the caller from
          its own repository secrets:  <secret>.<KEY>=<value>  writes KEY of the Secret <release>-<secret>;
          <secret>.<KEY>?=<value>  is skipped while the value is empty. <secret> and KEY must be declared in
          requiredSecrets of the values. A line without "?" and with an empty value stops the deployment
          before anything is changed. Only the deploying job (dev) may receive it. The Secret objects are
          created by the platform; the runner may only patch the ones it was granted.
        required: false
      env-bundle:
        description: >-
          Optional configuration of the target environment as one JSON object: {"<ENV>_<NAME>": "<value>"}
          with string values only (any content, multi-line included). <ENV> is the upper-case environment
          (DEV_ for dev); a key of another environment is refused. NAME declared in requiredSecrets ->
          key of that Secret (a different bundle name: secrets.aliases in <values-dir>/overrides.yaml);
          NAME listed under overrides in that file -> config.<NAME>, checked like a repository variable and
          applied after it; any other NAME is an error. Every declared Secret key must be present unless
          it is listed in secrets.optional. An empty string counts as absent. Only the deploying job (dev)
          may receive it; do not pass app-secrets together with it.
        required: false

permissions:
  contents: read

env:
  HELM_VERSION: '4.3.1'
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  KUBECTL_VERSION: '1.35.10'
  KUBECTL_SHA256: c49a28f1f4efc4d475ed05f47f2ce8e563bf7bef69ed77fe1b924ea6d83b6327
  KUBECONFORM_VERSION: '0.8.0'
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUBERNETES_VERSION: '1.35.6'
  # Fixed parts of the contract with the platform; deliberately not inputs.
  RUNNER_LABEL: akjet-ds-apps
  DEV_DEPLOY_BRANCH: dev-k8s/release

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # packages: read - the shared chart is a private GHCR package. The calling job must grant it as well.
    permissions:
      contents: read
      packages: read
    outputs:
      namespace: ${{ steps.target.outputs.namespace }}
      release: ${{ steps.target.outputs.release }}
      runner: ${{ steps.target.outputs.runner }}
      chart: ${{ steps.target.outputs.chart }}
      digest: ${{ steps.target.outputs.digest }}
      deploy: ${{ steps.target.outputs.deploy }}
      overrides: ${{ steps.overrides.outputs.json }}
      declared-secrets: ${{ steps.declared.outputs.list }}
      secret-plan: ${{ steps.bundle.outputs.plan }}
      bundle-shadowed: ${{ steps.bundle.outputs.shadowed }}
    steps:
      - name: Resolve and check the target
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ inputs.image-digest }}
          CHART_VERSION: ${{ inputs.chart-version }}
          RELEASE_INPUT: ${{ inputs.release }}
          VALUES_DIR: ${{ inputs.values-dir }}
          CHART_INPUT: ${{ inputs.chart }}
          TIMEOUT: ${{ inputs.timeout }}
          VALIDATE_ONLY: ${{ inputs.validate-only }}
          DEPLOY_ENABLED: ${{ vars.K8S_DEV_DEPLOY_ENABLED }}
          # Only whether the secret was passed, never its content: this job runs outside the cluster.
          APP_SECRETS_SUPPLIED: ${{ secrets.app-secrets != '' }}
          ENV_BUNDLE_SUPPLIED: ${{ secrets.env-bundle != '' }}
        run: |
          set -euo pipefail
          die() { echo "::error::$1"; exit 1; }
          label='^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'

          # Explicit allow-list of what this workflow may do. It is changed here, in review, never by
          # callers: there is no input for the namespace, the runner or the deployment branch.
          deploy=false
          case "${ENVIRONMENT}" in
            dev)
              if [ "${VALIDATE_ONLY}" != "true" ]; then
                [ "${GITHUB_REF}" = "refs/heads/${DEV_DEPLOY_BRANCH}" ] \
                  || die "deployment to dev is allowed only from the branch ${DEV_DEPLOY_BRANCH} (this run: ${GITHUB_REF})"
                case "${GITHUB_EVENT_NAME}" in
                  push|workflow_dispatch) ;;
                  *) die "deployment is not allowed for the event '${GITHUB_EVENT_NAME}'" ;;
                esac
                deploy=true
              fi ;;
            stage)
              [ "${VALIDATE_ONLY}" = "true" ] \
                || die "this workflow only validates the stage configuration; stage is deployed by the platform-controlled dispatcher" ;;
            *) die "environment '${ENVIRONMENT}' is not known to this workflow" ;;
          esac

          service="${GITHUB_REPOSITORY#*/}"
          printf '%s' "${service}" | grep -Eq "${label}" \
            || die "repository name '${service}' cannot be used as a namespace suffix (lower case letters, digits, '-')"
          # Repositories the platform places in one namespace (k8s-infra namespaces/*.yaml). Every other
          # repository has its own namespace. Changed here, in review, together with the platform registry.
          case "${service}" in
            backend|lk-frontend) group="lk-backend" ;;
            *) group="${service}" ;;
          esac
          namespace="${ENVIRONMENT}-${group}"
          [ "${#namespace}" -le 63 ] || die "namespace '${namespace}' is longer than 63 characters"

          release="${RELEASE_INPUT:-${service}}"
          printf '%s' "${release}" | grep -Eq "${label}" || die "release must match ${label}"
          [ "${#release}" -le 40 ] || die "release is longer than 40 characters"
          if [ "${group}" != "${service}" ]; then
            # Shared namespace: a repository may only manage releases named after itself, so it can never
            # upgrade, roll back or replace the release of the other repository.
            case "${release}" in
              "${service}"|"${service}"-*) ;;
              *) die "namespace ${namespace} is shared: the release of ${service} must be '${service}' or start with '${service}-'" ;;
            esac
          fi

          if [ "${APP_SECRETS_SUPPLIED:-false}" = "true" ] && [ "${deploy}" != "true" ]; then
            die "app-secrets may be passed only to the job that deploys to dev; validation never receives secret values"
          fi
          if [ "${ENV_BUNDLE_SUPPLIED:-false}" = "true" ] && [ "${deploy}" != "true" ]; then
            die "env-bundle may be passed only to the run that deploys to dev; a validation-only run never receives secret values"
          fi
          if [ "${ENV_BUNDLE_SUPPLIED:-false}" = "true" ] && [ "${APP_SECRETS_SUPPLIED:-false}" = "true" ]; then
            die "pass either env-bundle or app-secrets, not both"
          fi

          if [ "${VALIDATE_ONLY}" = "true" ] && [ -z "${DIGEST}" ]; then
            # Validation does not need a real image: a placeholder digest keeps the schema satisfied.
            DIGEST="sha256:$(printf '0%.0s' $(seq 1 64))"
          fi
          printf '%s' "${DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$' \
            || die "image-digest must be sha256:<64 hex>; tags are not accepted"
          printf '%s' "${CHART_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || die "chart-version must be an exact version, e.g. 1.2.3"
          printf '%s' "${TIMEOUT}" | grep -Eq '^[0-9]{1,3}(s|m)$' || die "timeout must look like 300s or 10m"
          case "${VALUES_DIR}" in
            /*|*..*) die "values-dir must be a relative path inside the repository" ;;
          esac

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          chart="${CHART_INPUT:-oci://ghcr.io/${owner}/charts/akjet-app}"
          case "${chart}" in
            oci://*) ;;
            ./*) case "${chart}" in *..*) die "chart path must stay inside the repository" ;; esac ;;
            *) die "chart must be an oci:// reference or a ./path inside the repository" ;;
          esac

          {
            echo "namespace=${namespace}"
            echo "release=${release}"
            echo "runner=${RUNNER_LABEL}"
            echo "chart=${chart}"
            echo "digest=${DIGEST}"
            echo "deploy=${deploy}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${deploy}" = "true" ] && [ "${DEPLOY_ENABLED}" != "true" ]; then
            echo "::notice::manifests are validated, but deployment is disabled: repository variable K8S_DEV_DEPLOY_ENABLED is not 'true'"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One JSON object with the configuration of the target environment (secret env-bundle). This step only
      # classifies and checks it: nothing is written anywhere, and no value is printed - messages carry names.
      #   NAME declared in requiredSecrets        -> key of that Kubernetes Secret (written by the deploy job)
      #   NAME listed in overrides.yaml overrides -> config.<NAME> (validated by the next step, like a variable)
      #   anything else                           -> error
      # Rules of <values-dir>/overrides.yaml used here:
      #   secrets.aliases   { BUNDLE_NAME: <secret>.<KEY> }  only where the bundle name differs from the key
      #   secrets.optional  [ <secret>.<KEY> | <secret>.* ]  may be absent; every other declared key is required
      #   locked.<environment>  [ NAME ]                     may not be supplied for that environment at all
      # BUNDLE_MODE=template prints a bundle skeleton instead (scripts/env-bundle.sh); it is never set in CI.
      - name: Check the environment bundle
        id: bundle
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VALUES_DIR: ${{ inputs.values-dir }}
          ENV_BUNDLE: ${{ secrets.env-bundle }}
          BUNDLE_SECRET: ${{ inputs.env-bundle-secret }}
        run: |
          set -euo pipefail
          die() { echo "::error::$1"; exit 1; }
          mode="${BUNDLE_MODE:-check}"
          prefix="$(printf '%s' "${ENVIRONMENT}" | tr '[:lower:]' '[:upper:]')_"
          config_out="${RUNNER_TEMP}/bundle-config.json"
          echo '{}' > "${config_out}"
          target="${BUNDLE_SECRET:-}"
          if [ -n "${target}" ]; then
            printf '%s' "${target}" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$' || die "env-bundle-secret must be the name of a Secret of requiredSecrets"
          fi
          if [ "${mode}" = "check" ] && [ -z "${ENV_BUNDLE:-}" ]; then
            echo "plan=" >> "${GITHUB_OUTPUT}"
            echo "shadowed=" >> "${GITHUB_OUTPUT}"
            echo "No env-bundle was passed."
            exit 0
          fi
          for f in "${VALUES_DIR}/values.yaml" "${VALUES_DIR}/values-${ENVIRONMENT}.yaml"; do
            test -f "${f}" || die "values file not found: ${f}"
          done
          # Declarations of the service (names only), with the precedence of Helm.
          # shellcheck disable=SC2016  # yq / jq programs, not shell
          yq ea -o=json '. as $doc ireduce ({}; . * $doc) | {"config": ((.config // {}) | keys), "secrets": (.requiredSecrets // {}), "migration": ((.migration.config // {}) | keys)}' \
            "${VALUES_DIR}/values.yaml" "${VALUES_DIR}/values-${ENVIRONMENT}.yaml" > "${RUNNER_TEMP}/bundle-declared.json"
          if [ -f "${VALUES_DIR}/overrides.yaml" ]; then
            yq -o=json '.' "${VALUES_DIR}/overrides.yaml" > "${RUNNER_TEMP}/bundle-rules.json"
          else
            echo '{}' > "${RUNNER_TEMP}/bundle-rules.json"
          fi
          if [ "${mode}" = "check" ]; then
            # jq quotes its input in parse errors: its diagnostics are discarded, never shown.
            printf '%s' "${ENV_BUNDLE}" | jq -e 'type == "object"' >/dev/null 2>&1 \
              || die "env-bundle is not a JSON object (its content is not shown)"
            bytes="$(printf '%s' "${ENV_BUNDLE}" | wc -c | tr -d ' ')"
          else
            ENV_BUNDLE='{}'; bytes=0
          fi
          # shellcheck disable=SC2016  # jq program, not shell
          result="$(printf '%s' "${ENV_BUNDLE}" | jq -c --arg prefix "${prefix}" --arg env "${ENVIRONMENT}" --arg target "${target}" \
                      --slurpfile decl "${RUNNER_TEMP}/bundle-declared.json" --slurpfile rules "${RUNNER_TEMP}/bundle-rules.json" '
            . as $b
            | $decl[0] as $d
            | (($rules[0] // {}) | if type == "object" then . else {} end) as $r
            | ($r.overrides // {}) as $allow
            | (($r.secrets // {}).aliases // {}) as $aliases
            | (($r.secrets // {}).optional // []) as $optional
            | (($r.locked // {})[$env] // []) as $locked
            | [$d.secrets | to_entries[] | .key as $s | (.value // [])[] | "\($s).\(.)"] as $targets
            | ($aliases | to_entries | map({key: .value, value: .key}) | from_entries) as $aliasOf
            # target "<secret>.<KEY>" -> its name in the bundle (the key itself unless an alias renames it)
            | ($targets | map({key: ., value: ($aliasOf[.] // (split(".")[1:] | join(".")))}) | from_entries) as $source
            | ($source | to_entries | map({key: .value, value: .key}) | from_entries) as $targetOf
            | ($source | to_entries | group_by(.value) | map(select(length > 1)
                | "\(.[0].value) is the bundle name of more than one Secret key (\(map(.key) | join(", "))): give the others their own name in secrets.aliases of overrides.yaml")) as $ambiguous
            | ($aliases | to_entries | map(select((.key | test("^[A-Z][A-Z0-9_]*$") | not) or (.value | test("^[a-z0-9]([a-z0-9-]*[a-z0-9])?\\.[A-Za-z0-9_.-]+$") | not))
                | "secrets.aliases: an entry is not NAME: <secret>.<KEY>")) as $badAliases
            | def optional($t): ($optional | index($t)) != null or ($optional | index(($t | split(".")[0]) + ".*")) != null;
            def provided($t): ($b[$prefix + $source[$t]] | type == "string" and length > 0);
            if $target != "" then
              # Pass-through: every entry is a key of ONE Secret. No declaration, no allow-list, no type check.
              ( [ $aliases | to_entries[] | select(.value | startswith($target + ".")) | .key ] ) as $aliasedIntoTarget
              | ( [ $b | to_entries[]
                    | .key as $k | .value as $v
                    | if ($k | startswith($prefix) | not) then
                        (if ($k | test("^[A-Z][A-Z0-9]*_[A-Za-z_][A-Za-z0-9_]*$")) then "\($k) does not start with \($prefix): a bundle holds the keys of exactly one environment and this run accepts no other"
                         else "a key does not start with \($prefix) (the key is not shown)" end)
                      else ($k | ltrimstr($prefix)) as $n
                      | if ($n | test("^[A-Za-z_][A-Za-z0-9_]*$") | not) then "a \($prefix)* key is not a valid environment variable name: letters, digits and _ only, not starting with a digit (the key is not shown)"
                        elif ($v | type) as $t | ($t != "string" and $t != "number" and $t != "boolean") then "\($k): the value must be a string, a number or a boolean, not \($v | type)"
                        else empty end
                      end ] ) as $keyErrors
              | ( if ($d.secrets | has($target)) then [] else ["env-bundle-secret: \($target) is not a Secret declared in requiredSecrets of the values files"] end
                  + [ $aliases | to_entries[] | (.value | split(".")[0]) as $s | select(($d.secrets | has($s)) | not)
                      | "secrets.aliases.\(.key): Secret \($s) is not declared in requiredSecrets of the values files" ] ) as $declErrors
              | ( [ $b | to_entries[] | select(.key | startswith($prefix)) | (.key | ltrimstr($prefix)) as $n
                    | select(($n | test("^[A-Za-z_][A-Za-z0-9_]*$")) and ((.value | type) as $t | $t == "string" or $t == "number" or $t == "boolean"))
                    | select((.value | type) != "string" or (.value | length) > 0)
                    | $n ] ) as $names
              | { errors: ($badAliases + $declErrors + $keyErrors),
                  plan: ($names | map(if $aliases[.] != null then "\($aliases[.])=\(.)" else "\($target).\(.)=\(.)" end)),
                  # set by the values files AND supplied by the bundle; settings under migration.config are not shadowed
                  shadowed: ($names | map(select(. as $n | $aliases[$n] == null and ($d.config | index($n)) != null and ($d.migration | index($n)) == null))),
                  config: {}, template: ($aliases | keys | map({key: ($prefix + .), value: ""}) | from_entries) }
            elif $mode == "template" then
              { template:
                  ( ($targets | map(select(optional(.) | not)) | map({key: ($prefix + $source[.]), value: ""}))
                  + ($targets | map(select(optional(.))) | map({key: ($prefix + $source[.]), value: ""}))
                  + ($allow | keys | map(select(. as $n | $locked | index($n) | not)) | map({key: ($prefix + .), value: ""}))
                  | from_entries ),
                required: ($targets | map(select(optional(.) | not)) | map($prefix + $source[.])),
                errors: ($ambiguous + $badAliases) }
            else
              ( [ $b | to_entries[]
                  | .key as $k | .value as $v
                  | if ($k | startswith($prefix) | not) then
                      (if ($k | test("^[A-Z][A-Z0-9]*_[A-Z][A-Z0-9_]*$")) then "\($k) does not start with \($prefix): a bundle holds the keys of exactly one environment and this run accepts no other"
                       else "a key does not start with \($prefix) (the key is not shown)" end)
                    else ($k | ltrimstr($prefix)) as $n
                    | if ($n | test("^[A-Z][A-Z0-9_]*$") | not) then "a \($prefix)* key has an invalid name: upper case letters, digits and _ only (the key is not shown)"
                      elif ($v | type) != "string" then "\($k): the value must be a JSON string, not \($v | type)"
                      elif ($v | length) == 0 then empty
                      elif ($locked | index($n)) != null then "\($k): \($n) is locked for \($env) and cannot be supplied"
                      elif $targetOf[$n] != null then empty
                      elif $allow[$n] != null then empty
                      elif ($d.config | index($n)) != null then "\($k): \($n) is set in the values files and is not listed under overrides in overrides.yaml"
                      else "\($k): \($n) is declared neither in requiredSecrets of the values files nor in overrides.yaml" end
                    end ] ) as $keyErrors
              | ($targets | map(select(provided(.)))) as $have
              | ($targets | map(select((provided(.) | not) and (optional(.) | not))
                  | "\($prefix)\($source[.]) is required (key of Secret \(.)) and is missing or empty")) as $missing
              | { errors: ($ambiguous + $badAliases + $keyErrors + $missing),
                  plan: ($have | map("\(.)=\($source[.])")),
                  config: ([ $b | to_entries[] | select(.key | startswith($prefix)) | (.key | ltrimstr($prefix)) as $n
                             | select((.value | type) == "string" and (.value | length) > 0 and $targetOf[$n] == null and $allow[$n] != null) ] | from_entries) }
            end
          ' --arg mode "${mode}" 2>/dev/null)" || die "env-bundle could not be evaluated (its content is not shown)"
          unset ENV_BUNDLE
          errors="$(printf '%s' "${result}" | jq -r '.errors[]')"
          if [ -n "${errors}" ]; then
            while IFS= read -r line; do echo "::error::env-bundle: ${line}"; done <<< "${errors}"
            exit 1
          fi
          if [ "${mode}" = "template" ]; then
            printf '%s' "${result}" | jq '.template'
            exit 0
          fi
          printf '%s' "${result}" | jq -c '.config' > "${config_out}"
          plan="$(printf '%s' "${result}" | jq -r '.plan | join(" ")')"
          echo "plan=${plan}" >> "${GITHUB_OUTPUT}"
          # Names set by the values files that the Secret also provides. In the workloads the Secret wins by
          # itself (envFrom: ConfigMap first, Secret last). The migration Job declares its configuration as
          # explicit env, which would win over the Secret - the deploy job removes exactly these entries.
          echo "shadowed=$(printf '%s' "${result}" | jq -r '(.shadowed // []) | join(" ")')" >> "${GITHUB_OUTPUT}"
          echo "env-bundle: ${bytes} bytes (GitHub limit for one secret: 48 KB)"
          if [ -n "${target}" ]; then
            echo "Pass-through to Secret '${target}': $(printf '%s' "${result}" | jq -r '.plan | length') entries; values of the values files that the Secret overrides: $(printf '%s' "${result}" | jq -r '.shadowed | join(", ") | if . == "" then "none" else . end')"
          fi
          echo "Secret keys from the bundle: $(printf '%s' "${result}" | jq -r '[.plan[] | split("=")[0]] | join(", ") | if . == "" then "none" else . end')"
          echo "Configuration overrides from the bundle: $(printf '%s' "${result}" | jq -r '.config | keys | map(ltrimstr($p)) | join(", ") | if . == "" then "none" else . end' --arg p "${prefix}")"
          if [ "${bytes}" -gt 44000 ]; then
            echo "::warning::env-bundle is ${bytes} bytes; GitHub rejects a secret larger than 48 KB - split the configuration before it grows further"
          fi

      # Optional overrides of NON-SENSITIVE configuration by GitHub repository variables of the calling
      # repository. The values files stay the source of configuration; a variable only replaces a value the
      # service explicitly allowed in <values-dir>/overrides.yaml:
      #
      #   overrides:
      #     DB_HOST: { path: config.DB_HOST, type: host }     # variable DEV_DB_HOST / STAGE_DB_HOST
      #
      # Rules enforced here (not by the caller): only paths config.<NAME> can be overridden - never the image,
      # release, namespace, runner, security settings, replicas or Secret references; names that look like
      # credentials are refused; an absent or empty variable changes nothing; a variable of one environment
      # never applies to the other. Variables are read as data (JSON), never interpolated into a command.
      # The same rules apply to the configuration part of env-bundle (previous step): it is merged over the
      # repository variables and validated here. locked.<environment> names are refused from either source.
      - name: Resolve variable overrides
        id: overrides
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VALUES_DIR: ${{ inputs.values-dir }}
          REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/overrides.json"
          allow="${VALUES_DIR}/overrides.yaml"
          if [ ! -f "${allow}" ]; then
            echo '{}' > "${out}"
            echo "json={}" >> "${GITHUB_OUTPUT}"
            echo "No ${allow}: values files are used as they are."
            exit 0
          fi
          prefix="$(printf '%s' "${ENVIRONMENT}" | tr '[:lower:]' '[:upper:]')_"
          vars_file="${RUNNER_TEMP}/repository-variables.json"
          printf '%s' "${REPOSITORY_VARIABLES:-null}" > "${vars_file}"
          bundle_file="${RUNNER_TEMP}/bundle-config.json"
          [ -f "${bundle_file}" ] || echo '{}' > "${bundle_file}"
          yq -o=json '.' "${allow}" > "${RUNNER_TEMP}/overrides-allow.json"
          # A file that only carries rules for env-bundle (secrets, locked) and has no "overrides" key does not
          # switch the variable mechanism on: repository variables are not consulted, as without the file.
          if jq -e 'type == "object" and (has("overrides") | not) and ((keys - ["secrets", "locked"]) | length == 0)' "${RUNNER_TEMP}/overrides-allow.json" >/dev/null 2>&1; then
            echo '{}' > "${out}"
            echo "json={}" >> "${GITHUB_OUTPUT}"
            rm -f "${RUNNER_TEMP}/bundle-config.json"
            echo "${allow} lists no overrides: values files are used as they are."
            exit 0
          fi
          # shellcheck disable=SC2016  # jq program, not shell
          jq -n --arg prefix "${prefix}" --arg env "${ENVIRONMENT}" --slurpfile allow "${RUNNER_TEMP}/overrides-allow.json" \
                --slurpfile vars "${vars_file}" --slurpfile bundle "${bundle_file}" '
            def fail($m): error($m);
            ($allow[0] // {}) as $doc
            | (if ($doc | type) != "object" or (($doc | keys) - ["overrides", "secrets", "locked"] | length) > 0
               then fail("overrides.yaml: only the top-level keys \"overrides\", \"secrets\" and \"locked\" are allowed") else . end)
            | ((($doc.locked // {}) | if type == "object" then . else fail("overrides.yaml: \"locked\" must be a map of environment -> list of names") end)[$env] // []) as $locked
            | ($doc.overrides // {}) as $list
            | (if ($list | type) != "object" then fail("overrides.yaml: \"overrides\" must be a map") else . end)
            | ((($vars[0] // {}) | if type == "object" then . else {} end) + (($bundle[0] // {}) | if type == "object" then . else {} end)) as $v
            # every entry of the allow-list is checked, whether or not its variable is set
            | reduce ($list | to_entries[]) as $e ({};
                ($e.key) as $name
                | ($e.value | if type == "object" then . else fail("overrides.\($name): must be {path, type}") end) as $spec
                | (if ($name | test("^[A-Z][A-Z0-9_]{0,62}$")) then . else fail("overrides.\($name): the name must be upper case letters, digits and _") end)
                | (if (($spec | keys) - ["path", "type"] | length) > 0 then fail("overrides.\($name): only path and type are allowed") else . end)
                | (($spec.path // "") | tostring) as $path
                | (if ($path | test("^config\\.[A-Za-z_][A-Za-z0-9_]*$")) then . else fail("overrides.\($name): path \($path) is not allowed - only config.<NAME> can be overridden") end)
                | ($path | ltrimstr("config.")) as $key
                | (if ($key | test("PASSWORD|PASSWD|SECRET|TOKEN|ACCESS_KEY|(^|_)KEY$"; "i")) or ($name | test("PASSWORD|PASSWD|SECRET|TOKEN|ACCESS_KEY|(^|_)KEY$"; "i"))
                   then fail("overrides.\($name): \($key) looks like a credential and cannot come from a GitHub variable") else . end)
                | (($spec.type // "string") | tostring) as $type
                | (if (["string", "host", "url", "integer", "boolean"] | index($type)) then . else fail("overrides.\($name): unknown type \($type)") end)
                | ($v[$prefix + $name]) as $raw
                | if $raw == null or ($raw | tostring) == "" then .
                  elif ($locked | index($name)) != null then fail("variable \($prefix)\($name): \($name) is locked for \($env) (overrides.yaml) and cannot be supplied")
                  else ($raw | tostring) as $value
                  | (if ($value | length) > 2048 or ($value | test("[[:cntrl:]]")) then fail("variable \($prefix)\($name): control characters or more than 2048 characters") else . end)
                  | (if $type == "host" and ($value | test("^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$") | not) then fail("variable \($prefix)\($name): not a host name or address") else . end)
                  | (if $type == "url" and ($value | test("^https?://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?(/[^\\s]*)?$") | not) then fail("variable \($prefix)\($name): not an http(s) URL") else . end)
                  | (if $type == "integer" and ($value | test("^-?[0-9]{1,18}$") | not) then fail("variable \($prefix)\($name): not an integer") else . end)
                  | (if $type == "boolean" and ($value | test("^(true|false)$") | not) then fail("variable \($prefix)\($name): must be true or false") else . end)
                  # chart values under config are strings (ConfigMap data); the type was validated above
                  | .config[$key] = $value
                  end)
            # a variable of this environment that the service did not allow is a mistake, not a default
            | . as $result
            | ([$v | keys[] | select(startswith($prefix)) | ltrimstr($prefix)] - ($list | keys)) as $unknown
            | if ($unknown | length) > 0
              then fail("repository variable(s) \($unknown | map($prefix + .) | join(", ")) are not listed in overrides.yaml")
              else $result end
          ' > "${out}" || { echo "::error::variable overrides rejected (see the message above)"; exit 1; }
          rm -f "${vars_file}" "${bundle_file}"
          echo "json=$(jq -c '.' "${out}")" >> "${GITHUB_OUTPUT}"
          applied="$(jq -r '(.config // {}) | keys | join(", ")' "${out}")"
          if [ -n "${applied}" ]; then
            echo "Overridden by ${prefix}* repository variables or env-bundle keys: ${applied}"
            {
              echo "### Configuration overrides"
              echo
              echo "Values replaced by \`${prefix}*\` repository variables or env-bundle keys: \`${applied}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No ${prefix}* override is set: values files are used as they are."
          fi

      # Names only (no values exist in this job): "<secret>.<KEY>" for every key the merged values declare in
      # requiredSecrets. The deploy job refuses to write anything that is not in this list.
      - name: List declared Secret keys
        id: declared
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VALUES_DIR: ${{ inputs.values-dir }}
        run: |
          set -euo pipefail
          for f in "${VALUES_DIR}/values.yaml" "${VALUES_DIR}/values-${ENVIRONMENT}.yaml"; do
            test -f "${f}" || { echo "::error::values file not found: ${f}"; exit 1; }
          done
          # Same precedence as Helm: the environment file wins, lists are replaced.
          # shellcheck disable=SC2016  # yq / jq programs, not shell
          list="$(yq ea -o=json '. as $doc ireduce ({}; . * $doc) | .requiredSecrets // {}' \
                    "${VALUES_DIR}/values.yaml" "${VALUES_DIR}/values-${ENVIRONMENT}.yaml" \
                  | jq -r '[to_entries[] | .key as $name | (.value // [])[] | "\($name).\(.)"] | join(" ")')"
          for item in ${list}; do
            printf '%s' "${item}" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.[A-Za-z0-9_.-]+$' \
              || { echo "::error::requiredSecrets entry '${item}' cannot be used as <secret>.<KEY>"; exit 1; }
          done
          echo "list=${list}" >> "${GITHUB_OUTPUT}"
          echo "Declared Secret keys: ${list:-none}"

      - name: Install pinned tools
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"; mkdir -p "${bin}"; cd "${RUNNER_TEMP}"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && mv linux-amd64/helm "${bin}/helm"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform && mv kubeconform "${bin}/kubeconform"
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Render
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ steps.target.outputs.digest }}
          CHART_VERSION: ${{ inputs.chart-version }}
          VALUES_DIR: ${{ inputs.values-dir }}
          RUN_MIGRATIONS: ${{ inputs.run-migrations }}
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          RELEASE: ${{ steps.target.outputs.release }}
          CHART: ${{ steps.target.outputs.chart }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in "${VALUES_DIR}/values.yaml" "${VALUES_DIR}/values-${ENVIRONMENT}.yaml"; do
            test -f "${f}" || { echo "::error::values file not found: ${f}"; exit 1; }
          done
          # The chart package is private: log in with the job token (packages: read). The token is read
          # from stdin, never from the command line, and the login is removed again right after the pull.
          pull_chart() {
            case "${CHART}" in
              oci://ghcr.io/*)
                printf '%s' "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin >/dev/null
                helm pull "${CHART}" --version "${CHART_VERSION}" --untar --untardir "${RUNNER_TEMP}/chart" \
                  || { helm registry logout ghcr.io >/dev/null 2>&1 || true
                       echo "::error::cannot pull ${CHART} ${CHART_VERSION}: the calling job needs 'packages: read' and the package must grant this repository Actions read access"; exit 1; }
                helm registry logout ghcr.io >/dev/null 2>&1 || true ;;
              *)
                helm pull "${CHART}" --version "${CHART_VERSION}" --untar --untardir "${RUNNER_TEMP}/chart" ;;
            esac
          }
          case "${CHART}" in
            oci://*)
              pull_chart
              chart_dir="$(find "${RUNNER_TEMP}/chart" -mindepth 1 -maxdepth 1 -type d | head -1)" ;;
            *) chart_dir="${CHART}" ;;
          esac
          common=(
            "${RELEASE}" "${chart_dir}" --namespace "${NAMESPACE}"
            -f "${VALUES_DIR}/values.yaml" -f "${VALUES_DIR}/values-${ENVIRONMENT}.yaml"
            -f "${RUNNER_TEMP}/overrides.json"
            --set-string "image.digest=${DIGEST}"
          )
          helm lint "${chart_dir}" "${common[@]:2}"
          helm template "${common[@]}" --set migration.render=false > "${RUNNER_TEMP}/release.yaml"
          cp "${RUNNER_TEMP}/release.yaml" "${RUNNER_TEMP}/all.yaml"
          if [ "${RUN_MIGRATIONS}" = "true" ]; then
            helm template "${common[@]}" --set migration.render=true --set-string migration.runId=validate \
              --show-only templates/migration-job.yaml > "${RUNNER_TEMP}/migration.yaml" \
              || { echo "::error::run-migrations is set, but the values do not enable 'migration'"; exit 1; }
            cat "${RUNNER_TEMP}/migration.yaml" >> "${RUNNER_TEMP}/all.yaml"
          fi

      - name: Validate manifests
        run: |
          set -euo pipefail
          kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${RUNNER_TEMP}/all.yaml"

          # The release may contain only namespaced workload objects, none of them placed explicitly.
          # Routes (HTTPRoute) are owned by the platform (k8s-infra), never by an application release.
          kinds="$(yq ea -N 'select(. != null) | .kind' "${RUNNER_TEMP}/all.yaml" | sort -u | tr '\n' ' ')"
          echo "Rendered kinds: ${kinds}"
          for kind in ${kinds}; do
            case "${kind}" in
              ConfigMap|ServiceAccount|Deployment|Service|Job) ;;
              *) echo "::error::kind ${kind} must not be deployed by an application release"; exit 1 ;;
            esac
          done
          if [ "$(yq ea -N '[select(. != null and .metadata.namespace != null)] | length' "${RUNNER_TEMP}/all.yaml" | sort -u | tail -1)" != "0" ]; then
            echo "::error::manifests must not set metadata.namespace"; exit 1
          fi
          unpinned="$(yq ea -N '.spec.template.spec.containers[]?.image' "${RUNNER_TEMP}/all.yaml" | grep -Ev '@sha256:[a-f0-9]{64}$' || true)"
          if [ -n "${unpinned}" ]; then
            echo "::error::images must be pinned by digest: ${unpinned}"; exit 1
          fi

  deploy:
    name: Deploy ${{ needs.validate.outputs.release }} to ${{ needs.validate.outputs.namespace }}
    needs: validate
    # Three independent conditions: the target check above allowed a deployment (dev, from
    # dev-k8s/release), the caller did not ask for validation only, and deployment is switched on for
    # the repository.
    if: >-
      needs.validate.outputs.deploy == 'true' && !inputs.validate-only
      && inputs.environment == 'dev' && github.ref == 'refs/heads/dev-k8s/release'
      && vars.K8S_DEV_DEPLOY_ENABLED == 'true'
    # Shared self-hosted runner inside the cluster (ARC scale set akjet-ds-apps, env RUNNER_LABEL).
    # It is available to every repository in the runner group; what the job can change is limited by
    # the RBAC of its ServiceAccount (namespaced Role in enabled application namespaces only).
    runs-on: ${{ needs.validate.outputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    # One Helm operation per release at a time; a running deployment is never cancelled.
    concurrency:
      group: deploy-k8s-${{ github.repository }}-dev-${{ needs.validate.outputs.release }}
      cancel-in-progress: false

    env:
      # Release data is stored in ConfigMaps: Helm needs no access to Secrets, and no secret value ever
      # reaches a release record (application Secrets are not part of the chart).
      HELM_DRIVER: configmap
      ENVIRONMENT: dev
      DIGEST: ${{ needs.validate.outputs.digest }}
      CHART_VERSION: ${{ inputs.chart-version }}
      VALUES_DIR: ${{ inputs.values-dir }}
      TIMEOUT: ${{ inputs.timeout }}
      NAMESPACE: ${{ needs.validate.outputs.namespace }}
      RELEASE: ${{ needs.validate.outputs.release }}
      CHART: ${{ needs.validate.outputs.chart }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"; mkdir -p "${bin}"; cd "${RUNNER_TEMP}"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && mv linux-amd64/helm "${bin}/helm"
          curl -fsSLo "${bin}/kubectl" "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${bin}/kubectl" | sha256sum -c -
          chmod +x "${bin}/kubectl"
          echo "${bin}" >> "${GITHUB_PATH}"

      # Exactly the overrides the validate job resolved and validated: both jobs render the same configuration.
      - name: Apply variable overrides
        env:
          OVERRIDES: ${{ needs.validate.outputs.overrides }}
        run: |
          set -euo pipefail
          if [ -z "${OVERRIDES}" ]; then OVERRIDES='{}'; fi
          printf '%s\n' "${OVERRIDES}" > "${RUNNER_TEMP}/overrides.json"

      - name: Check the runner identity
        run: |
          set -euo pipefail
          test -r /var/run/secrets/kubernetes.io/serviceaccount/token \
            || { echo "::error::this job must run on a runner inside the cluster (no ServiceAccount token found)"; exit 1; }
          if [ -n "${KUBECONFIG:-}" ] || [ -e "${HOME}/.kube/config" ]; then
            echo "::error::a kubeconfig is present on the runner; only the pod ServiceAccount may be used"; exit 1
          fi
          for check in "create deployments.apps" "create configmaps" "create jobs.batch"; do
            # shellcheck disable=SC2086
            kubectl auth can-i ${check} --namespace "${NAMESPACE}" --quiet \
              || { echo "::error::the runner ServiceAccount may not '${check}' in ${NAMESPACE}"; exit 1; }
          done
          # Access to individual, named Secrets (ciManagedSecrets) is expected; access to all of them is not.
          for verb in get list create; do
            if kubectl auth can-i "${verb}" secrets --namespace "${NAMESPACE}" --quiet; then
              echo "::warning::the runner ServiceAccount can ${verb} every Secret in ${NAMESPACE}; the deployer role should not allow that"
            fi
          done

      - name: Fetch the chart
        id: chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in "${VALUES_DIR}/values.yaml" "${VALUES_DIR}/values-${ENVIRONMENT}.yaml"; do
            test -f "${f}" || { echo "::error::values file not found: ${f}"; exit 1; }
          done
          # The chart package is private: log in with the job token (packages: read). The token is read
          # from stdin, never from the command line, and the login is removed again right after the pull.
          pull_chart() {
            case "${CHART}" in
              oci://ghcr.io/*)
                printf '%s' "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin >/dev/null
                helm pull "${CHART}" --version "${CHART_VERSION}" --untar --untardir "${RUNNER_TEMP}/chart" \
                  || { helm registry logout ghcr.io >/dev/null 2>&1 || true
                       echo "::error::cannot pull ${CHART} ${CHART_VERSION}: the calling job needs 'packages: read' and the package must grant this repository Actions read access"; exit 1; }
                helm registry logout ghcr.io >/dev/null 2>&1 || true ;;
              *)
                helm pull "${CHART}" --version "${CHART_VERSION}" --untar --untardir "${RUNNER_TEMP}/chart" ;;
            esac
          }
          case "${CHART}" in
            oci://*)
              pull_chart
              echo "dir=$(find "${RUNNER_TEMP}/chart" -mindepth 1 -maxdepth 1 -type d | head -1)" >> "${GITHUB_OUTPUT}" ;;
            *) echo "dir=${CHART}" >> "${GITHUB_OUTPUT}" ;;
          esac

      # GitHub repository secrets -> keys of the Kubernetes Secrets the release declares. Runs before the
      # migration and the upgrade: a missing value or a missing permission stops the deployment with
      # nothing changed. Values travel only through this step's environment and pipes into kubectl's stdin:
      # they are never written to a file, a command line, an output or the summary, and are masked first.
      # Server-side apply owns exactly the keys supplied in this run; keys written by the platform stay as
      # they are. The Secret objects are created by the platform, and the runner needs `get` and `patch` on
      # exactly these names (k8s-infra: ciManagedSecrets) - it is never allowed to create or list Secrets.
      # Two sources, never both: env-bundle (JSON; which keys go where was decided by the validate job from
      # the values files - only names cross between the jobs) or app-secrets (explicit lines).
      - name: Provision application Secrets
        id: secrets
        env:
          APP_SECRETS: ${{ secrets.app-secrets }}
          ENV_BUNDLE: ${{ secrets.env-bundle }}
          DECLARED: ${{ needs.validate.outputs.declared-secrets }}
          PLAN: ${{ needs.validate.outputs.secret-plan }}
          BUNDLE_SECRET: ${{ inputs.env-bundle-secret }}
        run: |
          set -euo pipefail
          die() { echo "::error::$1"; exit 1; }
          done_unchanged() { echo "$1"; echo "changed=false" >> "${GITHUB_OUTPUT}"; exit 0; }
          # All permissions are checked before the first write.
          check_access() {
            local name verb
            for name in "$@"; do
              for verb in get patch; do
                kubectl auth can-i "${verb}" "secret/${RELEASE}-${name}" --namespace "${NAMESPACE}" --quiet \
                  || die "the runner may not ${verb} Secret ${RELEASE}-${name} in ${NAMESPACE}: the platform has to list it in ciManagedSecrets of the namespace (k8s-infra) - nothing was changed"
              done
            done
          }
          # stdin: the Secret manifest. Runs at the end of a pipeline (a subshell), so "a Secret was modified"
          # is recorded as an empty marker file; no value is ever written to disk.
          marker="${RUNNER_TEMP}/app-secrets-changed"; rm -f "${marker}"
          report_changed() {
            if [ -e "${marker}" ]; then echo "changed=true" >> "${GITHUB_OUTPUT}"; else echo "changed=false" >> "${GITHUB_OUTPUT}"; fi
            rm -f "${marker}"
          }
          apply_secret() {
            local object="$1" keys="$2" before after state
            before="$(kubectl --namespace "${NAMESPACE}" get secret "${object}" -o jsonpath='{.metadata.resourceVersion}' 2>/dev/null)" \
              || die "Secret ${object} does not exist in ${NAMESPACE}: the platform creates the (empty) object, this workflow only fills it"
            kubectl --namespace "${NAMESPACE}" apply --server-side --field-manager=akjet-app-secrets --force-conflicts -f - >/dev/null \
              || die "writing Secret ${object} failed (the response is not shown)"
            after="$(kubectl --namespace "${NAMESPACE}" get secret "${object}" -o jsonpath='{.metadata.resourceVersion}')"
            if [ "${before}" != "${after}" ]; then : > "${marker}"; state=updated; else state=unchanged; fi
            echo "Secret ${object}: ${state}; keys managed from GitHub: ${keys}"
          }

          if [ -n "${ENV_BUNDLE:-}" ] && [ -n "${APP_SECRETS:-}" ]; then
            die "pass either env-bundle or app-secrets, not both (nothing was changed)"
          fi

          if [ -n "${ENV_BUNDLE:-}" ]; then
            command -v jq >/dev/null 2>&1 || die "jq is not available on the runner; env-bundle cannot be read (nothing was changed)"
            [ -n "${PLAN:-}" ] || done_unchanged "env-bundle carries no Secret keys: Kubernetes Secrets are left as they are."
            prefix="$(printf '%s' "${ENVIRONMENT}" | tr '[:lower:]' '[:upper:]')_"
            for item in ${PLAN}; do
              printf '%s' "${item}" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.[A-Za-z0-9_.-]+=[A-Za-z_][A-Za-z0-9_]*$' \
                || die "the Secret plan of the validate job is malformed (nothing was changed)"
              planned="${item%%=*}"
              case " ${DECLARED} " in
                *" ${planned} "*) ;;
                *)
                  # Pass-through: any key of the ONE named Secret, provided that Secret itself is declared.
                  if [ -n "${BUNDLE_SECRET:-}" ] && [ "${planned%%.*}" = "${BUNDLE_SECRET}" ] && case " ${DECLARED}" in *" ${BUNDLE_SECRET}."*) true ;; *) false ;; esac; then :
                  else die "env-bundle: ${planned} is not declared in requiredSecrets of the values (nothing was changed)"; fi ;;
              esac
            done
            # The bundle must still hold every planned key (jq diagnostics would quote the input: discarded).
            # shellcheck disable=SC2016  # jq program, not shell
            printf '%s' "${ENV_BUNDLE}" | jq -e --arg p "${prefix}" --arg plan "${PLAN}" '
              . as $b | all($plan | split(" ")[]; (split("=")[1]) as $n | ($b[$p + $n] | type) as $t | ($t == "string" or $t == "number" or $t == "boolean"))' >/dev/null 2>&1 \
              || die "env-bundle does not contain every key planned by the validate job (nothing was changed)"
            # Mask every line of every value (a multi-line value is masked line by line).
            # shellcheck disable=SC2016  # jq program, not shell
            printf '%s' "${ENV_BUNDLE}" | jq -r --arg p "${prefix}" --arg plan "${PLAN}" '
              . as $b | $plan | split(" ")[] | $b[$p + (split("=")[1])] | tostring | split("\n")[] | sub("\r$"; "") | select(length >= 6)' 2>/dev/null \
              | while IFS= read -r line; do echo "::add-mask::${line}"; done
            names=""
            for item in ${PLAN}; do
              name="${item%%.*}"
              case " ${names} " in *" ${name} "*) ;; *) names="${names} ${name}" ;; esac
            done
            # shellcheck disable=SC2086  # a list of validated names
            check_access ${names}
            for name in ${names}; do
              object="${RELEASE}-${name}"
              keys=""
              for item in ${PLAN}; do
                target="${item%%=*}"
                if [ "${target%%.*}" = "${name}" ]; then keys="${keys}${target#*.} "; fi
              done
              # shellcheck disable=SC2016  # jq program, not shell
              printf '%s' "${ENV_BUNDLE}" | jq -c --arg p "${prefix}" --arg plan "${PLAN}" --arg s "${name}" --arg object "${object}" '
                . as $b
                | { apiVersion: "v1", kind: "Secret", metadata: { name: $object },
                    data: ([ $plan | split(" ")[] | split("=") | select(.[0] | startswith($s + "."))
                             | { key: (.[0] | ltrimstr($s + ".")), value: ($b[$p + .[1]] | tostring | @base64) } ] | from_entries) }' 2>/dev/null \
                | apply_secret "${object}" "${keys}"
            done
            unset ENV_BUNDLE
            report_changed
            exit 0
          fi

          [ -n "${APP_SECRETS:-}" ] || done_unchanged "Neither env-bundle nor app-secrets was passed: Kubernetes Secrets are left as they are."
          names=""      # Secret declarations that receive at least one key
          missing=""    # required keys whose GitHub secret is empty
          while IFS= read -r line || [ -n "${line}" ]; do
            line="${line%$'\r'}"
            [ -n "${line}" ] || continue
            head="${line%%=*}"
            [ "${head}" != "${line}" ] || die "app-secrets: every line must be <secret>.<KEY>=<value> (the offending line is not shown)"
            value="${line#*=}"
            optional=false
            case "${head}" in *"?") optional=true; head="${head%?}" ;; esac
            printf '%s' "${head}" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.[A-Za-z0-9_.-]+$' \
              || die "app-secrets: a line does not start with <secret>.<KEY> (the offending line is not shown)"
            case " ${DECLARED} " in
              *" ${head} "*) ;;
              *) die "app-secrets: ${head} is not declared in requiredSecrets of the values (${VALUES_DIR}/values*.yaml)" ;;
            esac
            if [ -z "${value}" ]; then
              if [ "${optional}" = "true" ]; then echo "Skipped (optional, not set): ${head}"; else missing="${missing} ${head}"; fi
              continue
            fi
            echo "::add-mask::${value}"
            name="${head%%.*}"; key="${head#*.}"
            var="DATA_$(printf '%s' "${name}" | tr '-' '_')"
            case " ${!var:-} " in *"\"${key}\":"*) die "app-secrets: ${head} is listed twice" ;; esac
            encoded="$(printf '%s' "${value}" | base64 | tr -d '\n')"
            printf -v "${var}" '%s' "${!var:+${!var},}\"${key}\":\"${encoded}\""
            case " ${names} " in *" ${name} "*) ;; *) names="${names} ${name}" ;; esac
            unset value encoded line
          done <<< "${APP_SECRETS}"
          unset APP_SECRETS
          [ -z "${missing}" ] || die "no value for:${missing} - the repository secret mapped to it is not set (nothing was changed)"
          [ -n "${names}" ] || done_unchanged "Every mapped key is optional and unset: nothing to write."
          # shellcheck disable=SC2086  # a list of validated names
          check_access ${names}
          for name in ${names}; do
            object="${RELEASE}-${name}"
            var="DATA_$(printf '%s' "${name}" | tr '-' '_')"
            keys="$(printf '%s' "${!var}" | tr ',' '\n' | cut -d'"' -f2 | tr '\n' ' ')"
            printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s"},"data":{%s}}\n' "${object}" "${!var}" \
              | apply_secret "${object}" "${keys}"
            unset "${var}"
          done
          report_changed

      # The migration Job is created before the upgrade and is not part of the Helm release.
      # A failed migration stops the deployment; the schema is never rolled back automatically.
      - name: Run the migration Job
        if: inputs.run-migrations
        env:
          CHART_DIR: ${{ steps.chart.outputs.dir }}
          SHADOWED: ${{ needs.validate.outputs.bundle-shadowed }}
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          helm template "${RELEASE}" "${CHART_DIR}" --namespace "${NAMESPACE}" \
            -f "${VALUES_DIR}/values.yaml" -f "${VALUES_DIR}/values-${ENVIRONMENT}.yaml" \
            -f "${RUNNER_TEMP}/overrides.json" \
            --set-string "image.digest=${DIGEST}" \
            --set migration.render=true --set-string "migration.runId=${run_id}" \
            --show-only templates/migration-job.yaml > "${RUNNER_TEMP}/migration.yaml"
          job="${RELEASE}-migrate-${run_id}"
          if [ -n "${SHADOWED:-}" ]; then
            # Pass-through bundle: these names come from the Secret. Their explicit env entries (values files)
            # are dropped from the Job so that the Secret is not overridden; migration.config stays untouched.
            # Only names are handled here - the manifest contains no Secret value.
            for name in ${SHADOWED}; do
              printf '%s' "${name}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || { echo "::error::malformed list of bundle names"; exit 1; }
            done
            command -v jq >/dev/null 2>&1 || { echo "::error::jq is not available on the runner; the migration Job cannot be prepared"; exit 1; }
            # shellcheck disable=SC2016  # jq program, not shell
            kubectl create --dry-run=client -o json -f "${RUNNER_TEMP}/migration.yaml" \
              | jq --arg names "${SHADOWED}" '($names | split(" ")) as $drop
                    | .spec.template.spec.containers |= map(if .env then .env |= map(select(.name as $n | ($drop | index($n)) | not)) else . end)' \
              | kubectl --namespace "${NAMESPACE}" create -f -
          else
            kubectl --namespace "${NAMESPACE}" create -f "${RUNNER_TEMP}/migration.yaml"
          fi

          seconds="${TIMEOUT%[sm]}"; case "${TIMEOUT}" in *m) seconds=$((seconds * 60)) ;; esac
          deadline=$(( $(date +%s) + seconds ))
          result=timeout
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            status="$(kubectl --namespace "${NAMESPACE}" get job "${job}" \
              -o jsonpath='{.status.succeeded}/{.status.failed}')"
            case "${status}" in
              1/*) result=succeeded; break ;;
              */[1-9]*) result=failed; break ;;
            esac
            sleep 5
          done
          echo "--- migration output (last 200 lines)"
          kubectl --namespace "${NAMESPACE}" logs "job/${job}" --tail=200 || true
          echo "### Migration Job \`${job}\`: ${result}" >> "${GITHUB_STEP_SUMMARY}"
          [ "${result}" = "succeeded" ] || { echo "::error::migration Job ${job}: ${result}"; exit 1; }

      - name: Helm upgrade
        env:
          CHART_DIR: ${{ steps.chart.outputs.dir }}
          RESTART: ${{ inputs.restart }}
          # Environment variables from a Secret are read at pod start: a changed Secret needs new pods.
          SECRETS_CHANGED: ${{ steps.secrets.outputs.changed }}
        run: |
          set -euo pipefail
          args=(
            upgrade --install "${RELEASE}" "${CHART_DIR}" --namespace "${NAMESPACE}"
            -f "${VALUES_DIR}/values.yaml" -f "${VALUES_DIR}/values-${ENVIRONMENT}.yaml"
            -f "${RUNNER_TEMP}/overrides.json"
            --set-string "image.digest=${DIGEST}"
            --set migration.render=false
            --rollback-on-failure --wait --timeout "${TIMEOUT}" --history-max 20
            --description "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID}"
          )
          if [ "${RESTART}" = "true" ] || [ "${SECRETS_CHANGED}" = "true" ]; then
            args+=(--set-string "rolloutRevision=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          fi
          helm "${args[@]}"

      - name: Verify the rollout
        run: |
          set -euo pipefail
          kubectl --namespace "${NAMESPACE}" rollout status deployment \
            --selector "app.kubernetes.io/instance=${RELEASE}" --timeout=120s
          kubectl --namespace "${NAMESPACE}" get deployments \
            --selector "app.kubernetes.io/instance=${RELEASE}" \
            -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,WANTED:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image'

      # Diagnostics never print Secret objects, pod specifications or environment variables.
      - name: Diagnostics
        if: failure()
        env:
          POD_LOGS: ${{ inputs.pod-logs-on-failure }}
        run: |
          set +e
          sel="app.kubernetes.io/instance=${RELEASE}"
          echo "--- helm history"
          helm history "${RELEASE}" --namespace "${NAMESPACE}" --max 5
          echo "--- workloads"
          kubectl --namespace "${NAMESPACE}" get deployments,replicasets,pods,jobs --selector "${sel}" -o wide
          echo "--- container states"
          kubectl --namespace "${NAMESPACE}" get pods --selector "${sel}" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\t"}{range .status.containerStatuses[*]}{.name}{" restarts="}{.restartCount}{" waiting="}{.state.waiting.reason}{" terminated="}{.state.terminated.reason}{" exit="}{.state.terminated.exitCode}{"  "}{end}{"\n"}{end}'
          echo "--- events (last 40)"
          kubectl --namespace "${NAMESPACE}" get events --sort-by=.lastTimestamp \
            -o custom-columns='TIME:.lastTimestamp,TYPE:.type,REASON:.reason,OBJECT:.involvedObject.name,MESSAGE:.message' | tail -40
          if [ "${POD_LOGS}" = "true" ]; then
            for pod in $(kubectl --namespace "${NAMESPACE}" get pods --selector "${sel}" -o name); do
              echo "--- logs ${pod} (last 50 lines)"
              kubectl --namespace "${NAMESPACE}" logs "${pod}" --all-containers --tail=50
            done
          fi
          exit 0

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deployment: ${JOB_STATUS}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`${RELEASE}\` |"
            echo "| Namespace | \`${NAMESPACE}\` |"
            echo "| Image digest | \`${DIGEST}\` |"
            echo "| Chart | \`${CHART}\` ${CHART_VERSION} |"
            echo "| Values commit | \`${GITHUB_SHA}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
