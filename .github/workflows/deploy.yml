name: Deploy over NetBird

# v2: the caller builds on the runner and uploads an artifact; the server only
# receives files and switches a symlink. No git / install / build runs remotely.
#
# Server layout under DEPLOY_PATH:
#   releases/<sha>/      one directory per deployed commit
#   current -> releases/<sha>
#   production -> current   (web server root; one-time migration, see README)

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the artifact (uploaded earlier in the same run) holding the files to serve
        type: string
        required: true
      target:
        description: Optional deploy target (e.g. brand), used for naming only
        type: string
        default: ''
      host:
        description: Server address inside the NetBird network
        type: string
        default: '10.128.0.5'
      port:
        description: SSH port
        type: number
        default: 22
      keep-releases:
        description: How many releases to keep on the server (the live one is never removed)
        type: number
        default: 3
      netbird-version:
        type: string
        default: '0.78.1'
    secrets:
      NETBIRD_SETUP_KEY:
        required: true
      NETBIRD_MANAGEMENT_URL:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_PATH:
        description: Absolute path of the deploy directory on the server
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.target || github.ref_name }}
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref_name }}-${{ inputs.target }}
      cancel-in-progress: false

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      RELEASE: ${{ github.sha }}
      KEEP_RELEASES: ${{ inputs.keep-releases }}

    steps:
      # Before touching the network: fail early if the artifact is missing or empty
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Check artifact
        run: |
          test -f dist/index.html || { echo "dist/index.html missing in ${{ inputs.artifact }}"; exit 1; }
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "Deploy path is empty for ${{ github.ref_name }}"
            exit 1
          fi
          du -sh dist

      - name: Connect to NetBird
        uses: Akjet-dev/ci/netbird@main
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          version: ${{ inputs.netbird-version }}
          wait-for-ip: ${{ inputs.host }}

      - name: Prepare release directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ inputs.host }}
          port: ${{ inputs.port }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,RELEASE
          script: |
            bash <<'EOS'
            set -euo pipefail
            cd "${DEPLOY_PATH}"

            # The web server root must already be production -> current.
            # Refuse to deploy into a layout we would half-update.
            if [ -e production ] && [ ! -L production ]; then
              echo "${DEPLOY_PATH}/production is a real directory; run the one-time migration first"
              exit 1
            fi
            if [ "$(readlink production || true)" != "current" ]; then
              echo "${DEPLOY_PATH}/production must be a symlink to 'current'"
              exit 1
            fi

            # Upload into <sha>.partial; it only becomes releases/<sha> once complete
            mkdir -p releases
            rm -rf -- "releases/${RELEASE}.partial"
            mkdir -- "releases/${RELEASE}.partial"
            EOS

      - name: Upload release
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # --no-owner/--no-group + --chmod: files inherit the setgid group of
          # DEPLOY_PATH and stay group-writable, so prune works for the whole group.
          rsync -az --delete --no-owner --no-group --chmod=D2775,F664 \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT} -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            dist/ "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}/releases/${RELEASE}.partial/"

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ inputs.host }}
          port: ${{ inputs.port }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,RELEASE,KEEP_RELEASES
          script: |
            bash <<'EOS'
            set -euo pipefail
            cd "${DEPLOY_PATH}"

            NEW="releases/${RELEASE}"
            PARTIAL="${NEW}.partial"

            test -f "${PARTIAL}/index.html" || { echo "${PARTIAL} is incomplete"; exit 1; }

            if [ "$(readlink current || true)" = "${NEW}" ]; then
              # Re-run of the commit that is already live: never rewrite the live dir
              echo "${RELEASE} is already live, discarding the re-upload"
              rm -rf -- "${PARTIAL}"
            else
              rm -rf -- "${NEW}"
              mv -- "${PARTIAL}" "${NEW}"
              touch -- "${NEW}"  # prune orders releases by mtime

              # Atomic switch: build the new link aside, then rename(2) it over 'current'
              ln -sfn "${NEW}" current.tmp
              mv -Tf current.tmp current
            fi
            echo "current -> $(readlink current)"

            # Prune: drop leftovers and keep the newest KEEP_RELEASES, never the live one
            LIVE="$(readlink current)"
            find releases -mindepth 1 -maxdepth 1 -type d -name '*.partial' -exec rm -rf -- {} +
            ls -1dt releases/*/ | sed 's:/$::' | tail -n +"$((KEEP_RELEASES + 1))" |
              while IFS= read -r dir; do
                [ "${dir}" = "${LIVE}" ] && continue
                echo "Removing ${dir}"
                rm -rf -- "${dir}"
              done

            echo "Releases kept:"
            ls -1dt releases/*/
            EOS

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          sudo netbird down || true
