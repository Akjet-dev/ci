# Every way to reference a Secret: envFrom, single key under another name, key as a file,
# component-specific references. No secret value appears anywhere.
image:
  repository: ghcr.io/example-org/example-api
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
config:
  SERVICE_ACCOUNT_FILE: /var/run/secrets/app/service-account.json
requiredSecrets:
  app: [APP_KEY, DB_PASSWORD]
  storage: [ACCESS_KEY_ID, SECRET_ACCESS_KEY]
  files: [SERVICE_ACCOUNT_JSON]
  payments: [PAYMENT_API_TOKEN, WEBHOOK_SIGNING_KEY]
envFromSecrets: [app]
secretEnv:
  AWS_ACCESS_KEY_ID: { secret: storage, key: ACCESS_KEY_ID }
  AWS_SECRET_ACCESS_KEY: { secret: storage, key: SECRET_ACCESS_KEY }
secretFiles:
  - { secret: files, key: SERVICE_ACCOUNT_JSON, mountPath: /var/run/secrets/app/service-account.json }
components:
  web:
    ports: { http: 8080 }
    service: { enabled: true }
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { memory: 384Mi }
  worker:
    command: ["php", "artisan", "queue:work"]
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { memory: 384Mi }
    envFromSecrets: [payments]
    secretEnv:
      PAYMENT_WEBHOOK_KEY: { secret: payments, key: WEBHOOK_SIGNING_KEY }
