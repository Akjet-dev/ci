
name: Connect to NetBird
description: Install NetBird, connect to the network and wait for a route to the target host

inputs:
  setup-key:
    description: NetBird setup key
    required: true
  management-url:
    description: NetBird management URL
    required: true
  wait-for-ip:
    description: IP address that must be routed through the NetBird interface before continuing
    required: true
  wait-attempts:
    description: How many times to check the route (5 seconds apart)
    default: '18'

runs:
  using: composite
  steps:
    - name: Install NetBird
      shell: bash
      run: |
        set -euo pipefail

        curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

    - name: Disable NetBird lazy connections
      shell: bash
      run: |
        set -euo pipefail

        sudo netbird service reconfigure \
          --service-env NB_LAZY_CONN=off

        sudo systemctl restart netbird
        sleep 2

    - name: Connect to NetBird
      shell: bash
      env:
        NB_SETUP_KEY: ${{ inputs.setup-key }}
        NB_MANAGEMENT_URL: ${{ inputs.management-url }}
      run: |
        set -euo pipefail

        sudo netbird up \
          --setup-key "$NB_SETUP_KEY" \
          --management-url "$NB_MANAGEMENT_URL"

    - name: Wait for route to ${{ inputs.wait-for-ip }}
      shell: bash
      env:
        TARGET_IP: ${{ inputs.wait-for-ip }}
        ATTEMPTS: ${{ inputs.wait-attempts }}
      run: |
        set -euo pipefail

        for i in $(seq 1 "$ATTEMPTS"); do
          if ip route get "$TARGET_IP" 2>/dev/null | grep -q 'dev wt0'; then
            echo "NetBird route to ${TARGET_IP} is ready"
            ip route get "$TARGET_IP"
            exit 0
          fi

          echo "Waiting for NetBird route... $i/$ATTEMPTS"
          sleep 5
        done

        echo "NetBird route to ${TARGET_IP} was not installed"
        sudo netbird status -dA || true
        sudo netbird networks list || true
        exit 1
