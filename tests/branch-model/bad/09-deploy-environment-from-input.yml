# expect: B5 k8s-deploy.yml:deploy: a deploying job must target the literal environment 'dev'
# as: k8s-deploy.yml
name: K8s deploy
on:
  workflow_dispatch:
    inputs:
      environment: { type: string, required: true }
jobs:
  deploy:
    if: github.ref == 'refs/heads/dev-k8s/release' && vars.K8S_DEV_DEPLOY_ENABLED == 'true'
    uses: example-org/ci/.github/workflows/deploy-k8s.yml@0000000000000000000000000000000000000000
    with: { environment: "${{ inputs.environment }}", image-digest: "sha256:x", chart-version: 0.1.0 }
