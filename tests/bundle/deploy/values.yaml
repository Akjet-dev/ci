# Fixture for tests/run.sh: environment bundle (secret env-bundle of deploy-k8s.yml).
image:
  repository: ghcr.io/example-org/example-api
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
config:
  LOG_CHANNEL: stderr
  DB_PORT: "5432"
  DB_HOST: db.default.example.test
  FEATURE_WRITES_ENABLED: "false"
requiredSecrets:
  app: [APP_KEY, DB_PASSWORD, PARTNER_CERTIFICATE]
  migrate: [DB_PASSWORD]
envFromSecrets: [app]
components:
  web:
    ports: { http: 8080 }
    service: { enabled: true }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }
migration:
  enabled: true
  command: ["true"]
  envFromSecrets: [migrate]
  config:
    DB_USERNAME: example_migrator
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
